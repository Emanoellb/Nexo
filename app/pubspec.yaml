name: nexo
description: "Nexo: organização pessoal e produtividade."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^7.0.0
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  lucide_icons_flutter: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Só o símbolo vetorial entra no app. O resto de assets/brand/ (PNG, PDF,
  # ícones de launcher, favicons) é material de build e de marca.
  assets:
    - assets/brand/logo/svg/nexo-simbolo-claro.svg
    - assets/icons/google-g.svg

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
