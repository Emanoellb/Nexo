name: nexo
description: "Nexo: organização pessoal e produtividade."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cloud_firestore: ^7.0.0
  connectivity_plus: ^7.3.2
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  lucide_icons_flutter: ^4.0.1
  path_parsing: ^1.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # No app entram só os vetores: o símbolo e o nome integrado ("ne×o"). O
  # resto de assets/brand/ (PNG, PDF, ícones de launcher, favicons) é material
  # de build e de marca.
  assets:
    - assets/brand/logo/svg/nexo-simbolo-claro.svg
    - assets/brand/logo/svg/nexo-nome-integrado-claro.svg
    - assets/brand/logo/svg/nexo-nome-integrado-escuro.svg
    - assets/icons/google-g.svg
    # Termos de Uso e Política de Privacidade, lidos no app (feat/legal).
    - assets/legal/termos-de-uso.md
    - assets/legal/politica-de-privacidade.md

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf

# Ícone do launcher (só Android no MVP), a partir das camadas da marca
# (assets/brand/README.md). Gere com: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  min_sdk_android: 24
  # Ícone antigo (Android 7.x, sem ícone adaptativo).
  image_path: assets/brand/app-icon/ios/AppIcon-1024.png
  adaptive_icon_background: assets/brand/app-icon/android/ic_launcher_background-432.png
  adaptive_icon_foreground: assets/brand/app-icon/android/ic_launcher_foreground-432.png
  adaptive_icon_monochrome: assets/brand/app-icon/android/ic_launcher_monochrome-432.png
  # As camadas já trazem o símbolo dentro da zona segura de 66 dp.
  adaptive_icon_foreground_inset: 0
